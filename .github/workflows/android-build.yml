name: Android ARM64 build

on:
  workflow_dispatch:
  push:
    branches:
      - arena/d1751834-darkxkernal
      - main

permissions:
  contents: write

# Builds of the same branch run one after another, so two runs never replace
# that branch's release at the same time.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: ndk;24.0.8215888

      - name: Build executable
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/24.0.8215888"
          test -x "$NDK/build/ndk-build"
          # The checked-in dependency files contain Windows paths and CRLFs;
          # discard those generated files before rebuilding on the Linux runner.
          rm -rf obj/local/arm64-v8a
          set +e
          "$NDK/build/ndk-build" -C . > build.log 2>&1
          build_status=$?
          set -e
          cat build.log
          if [ "$build_status" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error file=build.log::$line"
            done < build.log
            exit "$build_status"
          fi
          test -s obj/local/arm64-v8a/android.system.svc

      # The runner is wiped as soon as the job ends, so the built file is lost
      # unless it is published. Workflow artifacts are not used because the
      # account's Actions artifact storage quota is full; release assets do not
      # count against that quota. Every build replaces one release per branch:
      #   main         -> release/tag "build-main", marked Latest, so this link
      #                   always serves the newest main build:
      #                   /releases/latest/download/android.system.svc
      #   other branch -> release/tag "build-<branch>", marked pre-release
      - name: Publish executable as a GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          f=libs/arm64-v8a/android.system.svc
          test -s "$f"
          tag="build-${GITHUB_REF_NAME//\//-}"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            flags=(--latest)
          else
            flags=(--prerelease --latest=false)
          fi
          repo_url="$GITHUB_SERVER_URL/$GH_REPO"
          run_url="$repo_url/actions/runs/$GITHUB_RUN_ID"
          download_url="$repo_url/releases/download/$tag/android.system.svc"

          {
            echo "Built by GitHub Actions from \`$GITHUB_REF_NAME\` @ \`${GITHUB_SHA::7}\`: $(git log -1 --format=%s)"
            echo
            echo "- File: \`android.system.svc\` (arm64-v8a)"
            echo "- Size: $(stat -c%s "$f") bytes"
            echo "- SHA-256: \`$(sha256sum "$f" | cut -d' ' -f1)\`"
            echo "- Build log: $run_url"
            echo
            echo "Downloaded files lose the executable bit: run \`chmod +x android.system.svc\` on the device before starting it."
            echo "This release is replaced automatically by the next build of \`$GITHUB_REF_NAME\`."
          } > "$RUNNER_TEMP/release-notes.md"

          # Drop the previous build of this branch (release and tag), then
          # recreate both on the commit that was just built. Retried because
          # a just-deleted tag can take a moment to disappear on GitHub.
          publish() {
            gh release delete "$tag" --cleanup-tag --yes > /dev/null 2>&1 || true
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$tag" > /dev/null 2>&1 || true
            gh release create "$tag" "$f" --target "$GITHUB_SHA" \
              --title "Build: $GITHUB_REF_NAME @ ${GITHUB_SHA::7}" \
              --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
          }
          publish || { sleep 5; publish; } || { sleep 15; publish; }

          {
            echo "## Build output: \`android.system.svc\` (arm64-v8a)"
            echo
            echo "- **Download:** $download_url"
            echo "- Release page: $repo_url/releases/tag/$tag"
            if [ "$GITHUB_REF_NAME" = "main" ]; then
              echo "- Permanent link to the newest main build: $repo_url/releases/latest/download/android.system.svc"
            fi
            echo
            echo "Downloaded files lose the executable bit: run \`chmod +x android.system.svc\` on the device before starting it."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish executable to the build branch
        if: github.ref_name == 'arena/d1751834-darkxkernal'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add obj/local/arm64-v8a/android.system.svc
          if git diff --cached --quiet; then
            echo "The built executable matches the checked-in binary."
          else
            git commit -m "Publish Android ARM64 build"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
