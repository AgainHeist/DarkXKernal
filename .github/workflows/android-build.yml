name: Android ARM64 build

on:
  workflow_dispatch:
  push:
    branches:
      - arena/d1751834-darkxkernal

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: ndk;24.0.8215888

      - name: Build executable
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/24.0.8215888"
          test -x "$NDK/build/ndk-build"
          set +e
          "$NDK/build/ndk-build" -C . > build.log 2>&1
          build_status=$?
          set -e
          cat build.log
          if [ "$build_status" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error file=build.log::$line"
            done < build.log
            exit "$build_status"
          fi
          test -s obj/local/arm64-v8a/android.system.svc

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: android-system-svc-arm64
          path: obj/local/arm64-v8a/android.system.svc
          if-no-files-found: error
