name: Android ARM64 build

on:
  workflow_dispatch:
  push:
    branches:
      - arena/d1751834-darkxkernal
      - arena/75d8ec6d-darkxkernal
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: ndk;24.0.8215888

      - name: Test license API
        run: python3 -m unittest server.test_app -v

      - name: Build executable
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/24.0.8215888"
          test -x "$NDK/build/ndk-build"
          # The checked-in dependency files contain Windows paths and CRLFs;
          # discard those generated files before rebuilding on the Linux runner.
          rm -rf obj/local/arm64-v8a
          set +e
          "$NDK/build/ndk-build" -C . > build.log 2>&1
          build_status=$?
          set -e
          cat build.log
          if [ "$build_status" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error file=build.log::$line"
            done < build.log
            exit "$build_status"
          fi
          test -s obj/local/arm64-v8a/android.system.svc

      - name: Publish executable to the build branch
        if: github.ref_name == 'arena/d1751834-darkxkernal' || github.ref_name == 'arena/75d8ec6d-darkxkernal'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add obj/local/arm64-v8a/android.system.svc
          if git diff --cached --quiet; then
            echo "The built executable matches the checked-in binary."
          else
            git commit -m "Publish Android ARM64 build"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
